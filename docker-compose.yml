version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: conference-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conference_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conference_password}
      POSTGRES_DB: ${POSTGRES_DB:-conference_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conference_user} -d ${POSTGRES_DB:-conference_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - conference-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conference-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-conference_user}:${POSTGRES_PASSWORD:-conference_password}@postgres:5432/${POSTGRES_DB:-conference_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: http://frontend:80
      CORS_ORIGIN: http://frontend:80
      # OAuth credentials (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # API keys (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - conference-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conference-frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_WS_BASE_URL: ws://backend:3001
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - conference-network

networks:
  conference-network:
    driver: bridge

volumes:
  postgres_data:

